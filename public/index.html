<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>世界杯2026(美加墨)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .pitch-line { position: absolute; border: 1px solid rgba(255,255,255,0.15); }
        .odds-btn { transition: background 0.1s; -webkit-tap-highlight-color: transparent; user-select: none; }
        .odds-btn:active { background: #dbeafe !important; }
        .odds-btn.selected { background: #eff6ff !important; border-color: #3b82f6 !important; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        /* Bottom Sheet 动画 */
        .sheet-overlay { transition: opacity 0.25s; }
        .sheet-panel { transition: transform 0.3s ease-out; }
        .sheet-open .sheet-overlay { opacity: 1; pointer-events: auto; }
        .sheet-open .sheet-panel { transform: translateY(0); }
    </style>
</head>
<body class="bg-[#f4f4f4] text-[#333] text-[13px] pb-6">

    <!-- 顶部导航 -->
    <div class="bg-[#0a2016] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <span class="text-lg">‹</span>
        <span class="font-semibold text-sm top-nav-title">世界杯2026(美加墨)</span>
        <span class="text-lg">☆</span>
    </div>

    <!-- 比赛选择 -->
    <div class="bg-[#eaeaea] border-b border-[#ddd] flex overflow-x-auto px-3 py-2 text-xs text-[#666] scrollbar-none" id="matchTabs">
        <span class="px-3 text-[#333] font-bold border-b-2 border-[#333] pb-1 whitespace-nowrap" data-match="墨西哥 vs 南非" onclick="switchMatch(this)">🇲🇽 墨西哥 vs 南非</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="韩国 vs 捷克" onclick="switchMatch(this)">🇰🇷 韩国 vs 捷克</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="加拿大 vs 波黑" onclick="switchMatch(this)">🇨🇦 加拿大 vs 波黑</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="美国 vs 巴拉圭" onclick="switchMatch(this)">🇺🇸 美国 vs 巴拉圭</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="卡塔尔 vs 瑞士" onclick="switchMatch(this)">🇶🇦 卡塔尔 vs 瑞士</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="荷兰 vs 日本" onclick="switchMatch(this)">🇳🇱 荷兰 vs 日本</span>
    </div>

    <!-- 足球场 -->
    <div class="relative mx-3 mt-3 rounded-lg overflow-hidden" style="height:180px; background: linear-gradient(to bottom, #15803d, #166534);">
        <div class="pitch-line left-1/2 top-0 bottom-0 -translate-x-1/2"></div>
        <div class="pitch-line left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full"></div>
        <div class="pitch-line left-[8%] top-1/4 bottom-1/4 w-16 rounded-sm"></div>
        <div class="pitch-line right-[8%] top-1/4 bottom-1/4 w-16 rounded-sm"></div>
        <div class="pitch-line left-[12%] top-1/3 bottom-1/3 w-4 rounded-sm"></div>
        <div class="pitch-line right-[12%] top-1/3 bottom-1/3 w-4 rounded-sm"></div>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
            <div class="flex items-center gap-8 mb-1">
                <div class="text-center"><div class="text-xs opacity-80">墨西哥</div></div>
                <div class="text-center">
                    <div class="text-xl font-bold text-[#fbbf24]" id="countdown">--:--:--</div>
                    <div class="text-[10px] opacity-60" id="matchStatus">距离开赛</div>
                </div>
                <div class="text-center"><div class="text-xs opacity-80">南非</div></div>
            </div>
            <div class="bg-black/50 rounded-lg px-4 py-1.5 flex gap-4 text-[10px] text-white/80">
                <span>进攻<br><strong class="text-white text-xs">0</strong></span>
                <span>危险进攻<br><strong class="text-white text-xs">0</strong></span>
                <span>控球率<br><strong class="text-white text-xs">50%</strong></span>
                <span>角球<br><strong class="text-white text-xs">0</strong></span>
            </div>
        </div>
        <div class="absolute top-2 left-3 text-white/80 text-[10px] pitch-area-home">🇲🇽 墨西哥</div>
        <div class="absolute top-2 right-3 text-white/80 text-[10px] pitch-area-away">南非 🇿🇦</div>
    </div>

    <!-- 图标菜单 -->
    <div class="flex justify-around items-center py-2 mx-3 text-xs text-[#999] border-b border-[#eee]">
        <span class="text-[#2563eb] font-bold">🏟️ 赛事</span>
        <span>📊 数据</span>
        <span>🎙️ 解说</span>
        <span>👕 阵容</span>
        <span>⚔️ VS</span>
        <span>📋 表格</span>
    </div>

    <!-- 赔率模块 -->
    <div class="px-3 space-y-2 mt-2">

        <!-- 让球 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">让球</div>
            <div class="grid grid-cols-2 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="主 -0/0.5" data-odds="1.06"><span class="text-[#666] text-xs">主 -0/0.5</span><span class="text-[#e1251b] font-bold text-sm">1.06</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="客 +0/0.5" data-odds="0.83"><span class="text-[#666] text-xs">客 +0/0.5</span><span class="text-[#e1251b] font-bold text-sm">0.83</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="主 -0.5" data-odds="0.75"><span class="text-[#666] text-xs">主 -0.5</span><span class="text-[#e1251b] font-bold text-sm">0.75</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="客 +0.5" data-odds="1.18"><span class="text-[#666] text-xs">客 +0.5</span><span class="text-[#e1251b] font-bold text-sm">1.18</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="主 -0.5/1" data-odds="1.35"><span class="text-[#666] text-xs">主 -0.5/1</span><span class="text-[#e1251b] font-bold text-sm">1.35</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="客 +0.5/1" data-odds="0.62"><span class="text-[#666] text-xs">客 +0.5/1</span><span class="text-[#e1251b] font-bold text-sm">0.62</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="主 -1" data-odds="0.51"><span class="text-[#666] text-xs">主 -1</span><span class="text-[#e1251b] font-bold text-sm">0.51</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="让球" data-option="客 +1" data-odds="1.65"><span class="text-[#666] text-xs">客 +1</span><span class="text-[#e1251b] font-bold text-sm">1.65</span></button>
            </div>
        </div>

        <!-- 大小 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">大小</div>
            <div class="grid grid-cols-2 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="大 2/2.5" data-odds="0.95"><span class="text-[#666] text-xs">大 2/2.5</span><span class="text-[#e1251b] font-bold text-sm">0.95</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="小 2/2.5" data-odds="0.93"><span class="text-[#666] text-xs">小 2/2.5</span><span class="text-[#e1251b] font-bold text-sm">0.93</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="大 2.5" data-odds="1.23"><span class="text-[#666] text-xs">大 2.5</span><span class="text-[#e1251b] font-bold text-sm">1.23</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="小 2.5" data-odds="0.69"><span class="text-[#666] text-xs">小 2.5</span><span class="text-[#e1251b] font-bold text-sm">0.69</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="大 2" data-odds="0.67"><span class="text-[#666] text-xs">大 2</span><span class="text-[#e1251b] font-bold text-sm">0.67</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="小 2" data-odds="1.26"><span class="text-[#666] text-xs">小 2</span><span class="text-[#e1251b] font-bold text-sm">1.26</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="大 2.5/3" data-odds="1.53"><span class="text-[#666] text-xs">大 2.5/3</span><span class="text-[#e1251b] font-bold text-sm">1.53</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="大小" data-option="小 2.5/3" data-odds="0.53"><span class="text-[#666] text-xs">小 2.5/3</span><span class="text-[#e1251b] font-bold text-sm">0.53</span></button>
            </div>
        </div>

        <!-- 独赢 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">独赢</div>
            <div class="grid grid-cols-3 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex flex-col items-center" data-module="独赢" data-option="主胜" data-odds="1.41"><span class="text-[#666] text-xs">主胜</span><span class="text-[#e1251b] font-bold text-sm mt-0.5">1.41</span></button>
                <button class="odds-btn bg-white p-3 flex flex-col items-center" data-module="独赢" data-option="平局" data-odds="4.40"><span class="text-[#666] text-xs">平局</span><span class="text-[#e1251b] font-bold text-sm mt-0.5">4.40</span></button>
                <button class="odds-btn bg-white p-3 flex flex-col items-center" data-module="独赢" data-option="客胜" data-odds="6.70"><span class="text-[#666] text-xs">客胜</span><span class="text-[#e1251b] font-bold text-sm mt-0.5">6.70</span></button>
            </div>
        </div>

        <!-- 波胆 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">波胆</div>
            <div class="grid grid-cols-3 text-center bg-[#f5f5f5] py-1.5 text-[10px] text-[#999] border-b border-[#eee]"><div>主胜</div><div>平局</div><div>客胜</div></div>
            <div class="grid grid-cols-3 gap-px bg-[#eee]">
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="1-0" data-odds="5.2"><span class="text-[#666] text-xs">1-0</span><span class="text-[#e1251b] font-bold text-sm">5.2</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="0-0" data-odds="8.0"><span class="text-[#666] text-xs">0-0</span><span class="text-[#e1251b] font-bold text-sm">8.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="0-1" data-odds="9.0"><span class="text-[#666] text-xs">0-1</span><span class="text-[#e1251b] font-bold text-sm">9.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="2-0" data-odds="9.0"><span class="text-[#666] text-xs">2-0</span><span class="text-[#e1251b] font-bold text-sm">9.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="1-1" data-odds="6.0"><span class="text-[#666] text-xs">1-1</span><span class="text-[#e1251b] font-bold text-sm">6.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="0-2" data-odds="15.0"><span class="text-[#666] text-xs">0-2</span><span class="text-[#e1251b] font-bold text-sm">15.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="3-0" data-odds="18.0"><span class="text-[#666] text-xs">3-0</span><span class="text-[#e1251b] font-bold text-sm">18.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="2-2" data-odds="12.0"><span class="text-[#666] text-xs">2-2</span><span class="text-[#e1251b] font-bold text-sm">12.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="1-2" data-odds="11.0"><span class="text-[#666] text-xs">1-2</span><span class="text-[#e1251b] font-bold text-sm">11.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="3-1" data-odds="21.0"><span class="text-[#666] text-xs">3-1</span><span class="text-[#e1251b] font-bold text-sm">21.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="3-3" data-odds="55.0"><span class="text-[#666] text-xs">3-3</span><span class="text-[#e1251b] font-bold text-sm">55.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="波胆" data-option="0-3" data-odds="35.0"><span class="text-[#666] text-xs">0-3</span><span class="text-[#e1251b] font-bold text-sm">35.0</span></button>
            </div>
            <div class="text-center py-2 text-[#2563eb] font-medium text-xs border-t border-[#eee] cursor-pointer active:bg-gray-50">显示更多</div>
        </div>

        <!-- 双方球队进球 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">双方球队进球</div>
            <div class="grid grid-cols-2 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="双方球队进球" data-option="是" data-odds="2.58"><span class="text-[#666] text-xs">是</span><span class="text-[#e1251b] font-bold text-sm">2.58</span></button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="双方球队进球" data-option="否" data-odds="1.52"><span class="text-[#666] text-xs">否</span><span class="text-[#e1251b] font-bold text-sm">1.52</span></button>
            </div>
        </div>

    </div>

    <!-- ====== Bottom Sheet 遮罩 + 弹窗 ====== -->
    <div id="betSheet" class="fixed inset-0 z-[100] pointer-events-none sheet-open" style="display:none">
        <!-- 遮罩 -->
        <div class="sheet-overlay absolute inset-0 bg-black/50 opacity-0 pointer-events-none" onclick="closeSheet()"></div>
        <!-- 弹窗面板 -->
        <div class="sheet-panel absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-xl translate-y-full max-h-[85vh] overflow-y-auto" style="transform: translateY(100%);">
            <!-- 拖动条 -->
            <div class="flex justify-center pt-2 pb-1"><div class="w-8 h-1 bg-gray-300 rounded-full"></div></div>

            <!-- 弹窗头部 -->
            <div class="flex items-center justify-between px-4 pb-2 border-b border-[#eee]">
                <span class="font-bold text-sm" id="sheetTitle">足球 让球</span>
                <span class="text-gray-400 text-lg cursor-pointer" onclick="closeSheet()">✕</span>
            </div>

            <!-- 赛事信息 -->
            <div class="px-4 py-2 border-b border-[#eee]">
                <div class="text-[10px] text-gray-400" id="sheetLeague">世界杯2026(美加墨)</div>
                <div class="text-sm font-medium" id="sheetMatch">墨西哥 v 南非</div>
            </div>

            <!-- 下注选项 -->
            <div class="px-4 py-3 border-b border-[#eee]">
                <div class="text-base" id="sheetSelection">
                    <span class="font-bold" id="sheetOptionName">南非 +1 / 1.5</span>
                    <span class="text-gray-400"> @ </span>
                    <span class="font-bold text-[#e1251b]" id="sheetOddsDisplay">0.83</span>
                </div>
            </div>

            <!-- 金额输入 -->
            <div class="px-4 py-3 border-b border-[#eee]">
                <div class="flex items-center gap-2">
                    <input type="text" inputmode="decimal" id="betAmount" placeholder="输入下注金额" class="flex-1 border border-gray-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-blue-500" value="" oninput="this.value=this.value.replace(/[^0-9.]/g,'').replace(/(\\..*)\\./g,'$1');calcPayout()">
                    <span class="text-blue-500 text-xs whitespace-nowrap cursor-pointer" onclick="document.getElementById('betAmount').value='10000';calcPayout()">最大投注金额</span>
                </div>
                <div class="text-xs text-gray-500 mt-2">
                    预计可赢：<span class="font-semibold text-[#e1251b]" id="payoutDisplay">0.00</span> RMB
                </div>
            </div>

            <!-- 底部操作栏 -->
            <div class="flex items-center gap-2 px-4 py-3 border-t border-[#eee]">
                <button class="w-9 h-9 flex items-center justify-center bg-gray-100 rounded-lg text-gray-500 text-sm">⚙️</button>
                <button class="flex-1 py-2.5 bg-gray-100 rounded-lg text-sm font-medium text-gray-700">加到下单</button>
                <button class="flex-1 py-2.5 bg-gray-800 rounded-lg text-sm font-medium text-white" id="betNowBtn">下注 0.00 RMB</button>
            </div>
        </div>
    </div>

    <script>
        // ====== 赔率点击 + Bottom Sheet ======
        let currentSheetData = {};

        document.querySelectorAll('.odds-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // 高亮
                const parent = this.closest('.grid');
                if (parent) {
                    parent.querySelectorAll('.odds-btn').forEach(b => b.classList.remove('selected'));
                }
                this.classList.add('selected');

                // 获取数据
                const module = this.dataset.module || '足球';
                const option = this.dataset.option || '';
                const odds = this.dataset.odds || '0';
                const matchName = document.querySelector('.top-nav-title').textContent.replace('世界杯2026(美加墨) · ', '') || '墨西哥 vs 南非';
                const parts = matchName.split(' vs ');

                currentSheetData = { module, option, odds, match: parts[0] + ' v ' + (parts[1] || '') };

                // 填充弹窗
                document.getElementById('sheetTitle').textContent = '足球 ' + module;
                document.getElementById('sheetLeague').textContent = '世界杯2026(美加墨)';
                document.getElementById('sheetMatch').textContent = parts[0] + ' v ' + (parts[1] || '');
                document.getElementById('sheetOptionName').textContent = option;
                document.getElementById('sheetOddsDisplay').textContent = odds;

                // 重置输入
                document.getElementById('betAmount').value = '';
                document.getElementById('payoutDisplay').textContent = '0.00';
                document.getElementById('betNowBtn').textContent = '下注 0.00 RMB';

                // 显示弹窗
                openSheet();
            });
        });

        function openSheet() {
            const sheet = document.getElementById('betSheet');
            sheet.style.display = 'block';
            sheet.classList.add('sheet-open');
            requestAnimationFrame(() => {
                document.querySelector('.sheet-overlay').classList.remove('opacity-0', 'pointer-events-none');
                document.querySelector('.sheet-panel').style.transform = 'translateY(0)';
            });
        }

        function closeSheet() {
            const sheet = document.getElementById('betSheet');
            document.querySelector('.sheet-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.querySelector('.sheet-panel').style.transform = 'translateY(100%)';
            setTimeout(() => { sheet.style.display = 'none'; }, 300);
        }

        // 金额输入联动
        function calcPayout() {
            const amount = parseFloat(document.getElementById('betAmount').value) || 0;
            const odds = parseFloat(currentSheetData.odds) || 0;
            const payout = amount * odds;
            document.getElementById('payoutDisplay').textContent = payout.toFixed(2);
            document.getElementById('betNowBtn').textContent = '下注 ' + amount.toFixed(2) + ' RMB';
        }
        document.getElementById('betAmount').addEventListener('input', calcPayout);

        // ====== 比赛切换 ======
        const matchTimes = {
            '墨西哥 vs 南非': { h: 3, m: 0 },
            '韩国 vs 捷克': { h: 10, m: 0 },
            '加拿大 vs 波黑': { h: 3, m: 0, d: 1 },
            '美国 vs 巴拉圭': { h: 9, m: 0, d: 1 },
            '卡塔尔 vs 瑞士': { h: 3, m: 0, d: 2 },
            '荷兰 vs 日本': { h: 20, m: 0, d: 2 }
        };
        let countdownInterval;

        function startCountdown(matchKey) {
            if (countdownInterval) clearInterval(countdownInterval);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const mt = matchTimes[matchKey] || { h: 3, m: 0 };
            let target = new Date(today);
            target.setHours(mt.h, mt.m, 0, 0);
            if (mt.d) target.setDate(target.getDate() + mt.d);

            function tick() {
                const diff = target - new Date();
                if (diff <= 0) {
                    document.getElementById('countdown').textContent = '00:00:00';
                    document.getElementById('matchStatus').textContent = '比赛中';
                    return;
                }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown').textContent =
                    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                document.getElementById('matchStatus').textContent = '距离开赛';
            }
            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        function switchMatch(el) {
            document.querySelectorAll('#matchTabs span').forEach(s => {
                s.classList.remove('text-[#333]', 'font-bold', 'border-b-2', 'border-[#333]');
            });
            el.classList.add('text-[#333]', 'font-bold', 'border-b-2', 'border-[#333]');
            const match = el.dataset.match;
            const parts = match.split(' vs ');
            document.querySelector('.pitch-area-home').textContent = '🇲🇽 ' + parts[0];
            document.querySelector('.pitch-area-away').textContent = parts[1] + ' 🇿🇦';
            document.querySelector('.top-nav-title').textContent = '世界杯2026(美加墨) · ' + match;
            startCountdown(match);
        }

        startCountdown('墨西哥 vs 南非');
    </script>

</body>
</html>
