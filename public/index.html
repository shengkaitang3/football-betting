<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>世界杯2026(美加墨)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .pitch-line {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .odds-btn {
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .odds-btn:active {
            background: #dbeafe !important;
        }
        .odds-btn.selected {
            background: #eff6ff !important;
            border-color: #3b82f6 !important;
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f4f4f4] text-[#333] text-[13px] pb-6">

    <!-- 顶部导航 -->
    <div class="bg-[#0a2016] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <span class="text-lg">‹</span>
        <span class="font-semibold text-sm top-nav-title">世界杯2026(美加墨)</span>
        <span class="text-lg">☆</span>
    </div>

    <!-- 比赛选择 -->
    <div class="bg-[#eaeaea] border-b border-[#ddd] flex overflow-x-auto px-3 py-2 text-xs text-[#666] scrollbar-none" id="matchTabs">
        <span class="px-3 text-[#333] font-bold border-b-2 border-[#333] pb-1 whitespace-nowrap" data-match="墨西哥 vs 南非" onclick="switchMatch(this)">🇲🇽 墨西哥 vs 南非</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="韩国 vs 捷克" onclick="switchMatch(this)">🇰🇷 韩国 vs 捷克</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="加拿大 vs 波黑" onclick="switchMatch(this)">🇨🇦 加拿大 vs 波黑</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="美国 vs 巴拉圭" onclick="switchMatch(this)">🇺🇸 美国 vs 巴拉圭</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="卡塔尔 vs 瑞士" onclick="switchMatch(this)">🇶🇦 卡塔尔 vs 瑞士</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="荷兰 vs 日本" onclick="switchMatch(this)">🇳🇱 荷兰 vs 日本</span>
    </div>

    <!-- 足球场 -->
    <div class="relative mx-3 mt-3 rounded-lg overflow-hidden" style="height:180px; background: linear-gradient(to bottom, #15803d, #166534);">
        <!-- 场线 -->
        <div class="pitch-line left-1/2 top-0 bottom-0 -translate-x-1/2"></div>
        <div class="pitch-line left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full"></div>
        <div class="pitch-line left-[8%] top-1/4 bottom-1/4 w-16 rounded-sm"></div>
        <div class="pitch-line right-[8%] top-1/4 bottom-1/4 w-16 rounded-sm"></div>
        <div class="pitch-line left-[12%] top-1/3 bottom-1/3 w-4 rounded-sm"></div>
        <div class="pitch-line right-[12%] top-1/3 bottom-1/3 w-4 rounded-sm"></div>

        <!-- 比分 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
            <div class="flex items-center gap-8 mb-1">
                <div class="text-center">
                    <div class="text-xs opacity-80">墨西哥</div>
                    <div class="text-4xl font-bold">0</div>
                </div>
                <div class="text-center">
                    <div class="text-xs opacity-80">南非</div>
                    <div class="text-4xl font-bold">0</div>
                </div>
            </div>
            <div class="text-[10px] opacity-60 mb-2">15:03 · 第1轮</div>
            <div class="bg-black/50 rounded-lg px-4 py-1.5 flex gap-4 text-[10px] text-white/80">
                <span>进攻<br><strong class="text-white text-xs">0</strong></span>
                <span>危险进攻<br><strong class="text-white text-xs">0</strong></span>
                <span>控球率<br><strong class="text-white text-xs">50%</strong></span>
                <span>角球<br><strong class="text-white text-xs">0</strong></span>
            </div>
        </div>

        <!-- 队名左上右上 -->
        <div class="absolute top-2 left-3 text-white/80 text-[10px] pitch-area-home">🇲🇽 墨西哥</div>
        <div class="absolute top-2 right-3 text-white/80 text-[10px] pitch-area-away">南非 🇿🇦</div>
    </div>

    <!-- 图标菜单 -->
    <div class="flex justify-around items-center py-2 mx-3 text-xs text-[#999] border-b border-[#eee]">
        <span class="text-[#2563eb] font-bold">🏟️ 赛事</span>
        <span>📊 数据</span>
        <span>🎙️ 解说</span>
        <span>👕 阵容</span>
        <span>⚔️ VS</span>
        <span>📋 表格</span>
    </div>

    <!-- 赔率模块 -->
    <div class="px-3 space-y-2 mt-2">

        <!-- 让球 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">让球</div>
            <div class="grid grid-cols-2 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">主 -0/0.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.06</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">客 +0/0.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.83</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">主 -0.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.75</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">客 +0.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.18</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">主 -0.5/1</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.35</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">客 +0.5/1</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.62</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">主 -1</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.51</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">客 +1</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.65</span>
                </button>
            </div>
        </div>

        <!-- 大小 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">大小</div>
            <div class="grid grid-cols-2 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">大 2/2.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.95</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">小 2/2.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.93</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">大 2.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.23</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">小 2.5</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.69</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">大 2</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.67</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">小 2</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.26</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">大 2.5/3</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.53</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">小 2.5/3</span>
                    <span class="text-[#e1251b] font-bold text-sm">0.53</span>
                </button>
            </div>
        </div>

        <!-- 独赢 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">独赢</div>
            <div class="grid grid-cols-3 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex flex-col items-center">
                    <span class="text-[#666] text-xs">主胜</span>
                    <span class="text-[#e1251b] font-bold text-sm mt-0.5">1.41</span>
                </button>
                <button class="odds-btn bg-white p-3 flex flex-col items-center">
                    <span class="text-[#666] text-xs">平局</span>
                    <span class="text-[#e1251b] font-bold text-sm mt-0.5">4.40</span>
                </button>
                <button class="odds-btn bg-white p-3 flex flex-col items-center">
                    <span class="text-[#666] text-xs">客胜</span>
                    <span class="text-[#e1251b] font-bold text-sm mt-0.5">6.70</span>
                </button>
            </div>
        </div>

        <!-- 波胆 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">波胆</div>
            <div class="grid grid-cols-3 text-center bg-[#f5f5f5] py-1.5 text-[10px] text-[#999] border-b border-[#eee]">
                <div>主胜</div>
                <div>平局</div>
                <div>客胜</div>
            </div>
            <div class="grid grid-cols-3 gap-px bg-[#eee]">
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">1-0</span><span class="text-[#e1251b] font-bold text-sm">5.2</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">0-0</span><span class="text-[#e1251b] font-bold text-sm">8.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">0-1</span><span class="text-[#e1251b] font-bold text-sm">9.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">2-0</span><span class="text-[#e1251b] font-bold text-sm">9.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">1-1</span><span class="text-[#e1251b] font-bold text-sm">6.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">0-2</span><span class="text-[#e1251b] font-bold text-sm">15.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">3-0</span><span class="text-[#e1251b] font-bold text-sm">18.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">2-2</span><span class="text-[#e1251b] font-bold text-sm">12.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">1-2</span><span class="text-[#e1251b] font-bold text-sm">11.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">3-1</span><span class="text-[#e1251b] font-bold text-sm">21.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">3-3</span><span class="text-[#e1251b] font-bold text-sm">55.0</span></button>
                <button class="odds-btn bg-white py-2.5 flex flex-col items-center"><span class="text-[#666] text-xs">0-3</span><span class="text-[#e1251b] font-bold text-sm">35.0</span></button>
            </div>
            <div class="text-center py-2 text-[#2563eb] font-medium text-xs border-t border-[#eee] cursor-pointer active:bg-gray-50">显示更多</div>
        </div>

        <!-- 双方球队进球 -->
        <div class="bg-white rounded shadow-sm overflow-hidden">
            <div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">双方球队进球</div>
            <div class="grid grid-cols-2 gap-px bg-[#eee]">
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">是</span>
                    <span class="text-[#e1251b] font-bold text-sm">2.58</span>
                </button>
                <button class="odds-btn bg-white p-3 flex justify-between items-center text-left">
                    <span class="text-[#666] text-xs">否</span>
                    <span class="text-[#e1251b] font-bold text-sm">1.52</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // 点击选中高亮效果
        document.querySelectorAll('.odds-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const parent = this.closest('.grid');
                if (parent) {
                    parent.querySelectorAll('.odds-btn').forEach(b => b.classList.remove('selected'));
                }
                this.classList.add('selected');
            });
        });

        // 切换比赛
        function switchMatch(el) {
            document.querySelectorAll('#matchTabs span').forEach(s => {
                s.classList.remove('text-[#333]', 'font-bold', 'border-b-2', 'border-[#333]');
            });
            el.classList.add('text-[#333]', 'font-bold', 'border-b-2', 'border-[#333]');
            const match = el.dataset.match;
            const parts = match.split(' vs ');
            // 更新球场队名
            document.querySelector('.pitch-area-home').textContent = '🇲🇽 ' + parts[0];
            document.querySelector('.pitch-area-away').textContent = parts[1] + ' 🇿🇦';
            // 更新标题
            document.querySelector('.top-nav-title').textContent = '世界杯2026(美加墨) · ' + match;
        }
    </script>

</body>
</html>
