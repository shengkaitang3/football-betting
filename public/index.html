<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实时赔率</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .top-nav {
            background: #0a2016; color: white; padding: 10px 12px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .top-nav .title { font-weight: 600; font-size: 14px; }
        .match-tabs {
            background: #eaeaea; border-bottom: 1px solid #ddd;
            display: flex; overflow-x: auto; padding: 6px 10px;
            font-size: 12px; color: #666; gap: 4px;
        }
        .match-tabs span {
            padding: 6px 16px; white-space: nowrap; cursor: pointer;
            border-radius: 20px; transition: all 0.2s;
            background: white; border: 1px solid #ddd;
        }
        .match-tabs span.active {
            background: #0a2016; color: white; border-color: #0a2016; font-weight: 600;
        }
        .screenshot-wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; }
        .screenshot-wrap img { width: 100%; display: block; height: auto; }
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7); color: white; text-align: center;
            padding: 6px; font-size: 11px; backdrop-filter: blur(10px); z-index: 50;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <span class="title">📸 赔率截图</span>
        <span style="font-size:11px;opacity:0.6" id="statusText">加载中...</span>
    </div>
    <div class="match-tabs" id="matchTabs">
        <span class="active" data-img="champion.jpg" onclick="switchTab(this)">🏆 冠军</span>
        <span data-img="mex-s.jpg" onclick="switchTab(this)">🇲🇽 墨西哥 vs 南非</span>
        <span data-img="kor-c.jpg" onclick="switchTab(this)">🇰🇷 韩国 vs 捷克</span>
        <span data-img="can-bos.jpg" onclick="switchTab(this)">🇨🇦 加拿大 vs 波黑</span>
    </div>
    <div class="screenshot-wrap">
        <img id="oddsImage" src="champion.jpg" alt="赔率截图" style="width:100%" onload="document.getElementById('statusText').textContent='就绪'" onerror="document.getElementById('statusText').textContent='加载失败'">
    </div>
    <div class="bottom-bar">📸 截图模式</div>
    <script>
        function switchTab(el) {
            document.querySelectorAll('#matchTabs span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            const img = document.getElementById('oddsImage');
            document.getElementById('statusText').textContent = '加载中...';
            img.src = el.dataset.img;
        }
    </script>
</body>
</html>
