<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实时赔率</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .top-nav {
            background: #0a2016; color: white; padding: 10px 12px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50; position: relative;
        }
        .top-nav .title { font-weight: 600; font-size: 14px; }
        .match-tabs {
            background: #eaeaea; border-bottom: 1px solid #ddd;
            display: flex; overflow-x: auto; padding: 6px 10px;
            font-size: 12px; color: #666; gap: 4px;
        }
        .match-tabs span, .match-tabs .ai-btn {
            padding: 6px 16px; white-space: nowrap; cursor: pointer;
            border-radius: 20px; transition: all 0.2s;
            background: white; border: 1px solid #ddd;
        }
        .match-tabs span.active {
            background: #0a2016; color: white; border-color: #0a2016; font-weight: 600;
        }
        .match-tabs .ai-btn {
            background: #1e40af; color: white; border-color: #1e40af; font-weight: 600;
        }
        .ai-panel {
            display: none; max-width: 480px; margin: 0 auto; padding: 10px;
            background: white; border-radius: 8px; border: 1px solid #eee;
            font-size: 12px; line-height: 1.7;
        }
        .ai-panel.show { display: block; }
        .ai-panel .ai-title { font-weight: 700; font-size: 13px; color: #1e40af; margin-bottom: 6px; }
        .ai-panel .ai-section { margin: 4px 0; }
        .ai-panel .ai-label { color: #666; }
        .ai-panel .ai-highlight { color: #e1251b; font-weight: 700; }
        .ai-panel .ai-green { color: #16a34a; font-weight: 700; }
        .screenshot-wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
        .screenshot-wrap img { width: 100%; display: block; height: auto; }
        .screenshot-wrap .time-tag {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fbbf24;
            font-size: 13px; font-weight: 700; padding: 4px 16px;
            border-radius: 8px; border: 1px solid #fbbf24; backdrop-filter: blur(4px);
        }
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7); color: white; text-align: center;
            padding: 6px; font-size: 11px; backdrop-filter: blur(10px); z-index: 50;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <span class="title">📸 赔率截图</span>
        <span style="font-size:10px;opacity:0.6;position:absolute;left:50%;transform:translateX(-50%)">赔率仅供参考，按实际赔率为准</span>
        <span style="font-size:12px;font-weight:700;color:#fbbf24" id="statusText">加载中...</span>
    </div>
    <div class="match-tabs" id="matchTabs">
        <span class="ai-btn" onclick="toggleAI()">🤖 AI分析</span>
        <span class="active" data-img="usa-par.jpg" data-time="06/12 13:01" onclick="switchTab(this)">🇺🇸 美国 vs 巴拉圭</span>
        <span data-img="can-bos.jpg" data-time="06/12 13:01" onclick="switchTab(this)">🇨🇦 加拿大 vs 波黑</span>
        <span data-img="qat-sui.jpg" data-time="" onclick="switchTab(this)">🇶🇦 卡塔尔 vs 瑞士</span>
        <span data-img="champion.jpg" data-time="" onclick="switchTab(this)">🏆 冠军</span>
    </div>
    <div class="screenshot-wrap" id="screenshotWrap">
        <span class="time-tag" id="timeTag">更新于 06/12 13:01</span>
        <img id="oddsImage" src="usa-par.jpg" alt="赔率截图" style="width:100%" onload="document.getElementById('statusText').textContent='就绪'" onerror="document.getElementById('statusText').textContent='加载失败'">
    </div>
    <div class="ai-panel" id="aiPanel">
        <div class="ai-title">🤖 AI分析</div>
        <div>
            <div style="font-weight:600;font-size:12px">🇺🇸 美国 vs 巴拉圭</div>
            <div class="ai-section"><span class="ai-label">📊 暂无分析，请提供赔率数据</span></div>
        </div>
    </div>
    <div class="bottom-bar">📸 截图模式 · 第一次加载较慢请耐心等待 🌸</div>
    <script>
        function switchTab(el) {
            document.querySelectorAll('#matchTabs span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            const img = document.getElementById('oddsImage');
            document.getElementById('statusText').textContent = '加载中...';
            img.src = el.dataset.img;
            document.getElementById('aiPanel').classList.remove('show');
            document.getElementById('screenshotWrap').style.display = 'block';
            // 显示更新时间
            document.getElementById('timeTag').textContent = el.dataset.time ? '更新于 ' + el.dataset.time : '';
        }
        function toggleAI() {
            const panel = document.getElementById('aiPanel');
            const wrap = document.getElementById('screenshotWrap');
            if (panel.classList.contains('show')) {
                panel.classList.remove('show');
                wrap.style.display = 'block';
            } else {
                panel.classList.add('show');
                wrap.style.display = 'none';
            }
        }
    </script>
</body>
</html>
