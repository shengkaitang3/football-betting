<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>世界杯2026(美加墨)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .pitch-line { position: absolute; border: 1px solid rgba(255,255,255,0.15); }
        .odds-btn { transition: background 0.1s; -webkit-tap-highlight-color: transparent; user-select: none; }
        .odds-btn:active { background: #dbeafe !important; }
        .odds-btn.selected { background: #eff6ff !important; border-color: #3b82f6 !important; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .sheet-overlay { transition: opacity 0.25s; }
        .sheet-panel { transition: transform 0.3s ease-out; }
    </style>
</head>
<body class="bg-[#f4f4f4] text-[#333] text-[13px] pb-6">

    <!-- 顶部导航 -->
    <div class="bg-[#0a2016] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <span class="text-lg">‹</span>
        <span class="font-semibold text-sm top-nav-title">世界杯2026(美加墨)</span>
        <span class="text-lg">☆</span>
    </div>

    <!-- 比赛选择 -->
    <div class="bg-[#eaeaea] border-b border-[#ddd] flex overflow-x-auto px-3 py-2 text-xs text-[#666] scrollbar-none" id="matchTabs">
        <span class="px-3 text-[#333] font-bold border-b-2 border-[#333] pb-1 whitespace-nowrap" data-match="韩国 vs 捷克" onclick="switchMatch(this)">🇰🇷 韩国 vs 捷克</span>
        <span class="px-3 border-l border-[#ccc] whitespace-nowrap" data-match="墨西哥 vs 南非" onclick="switchMatch(this)">🇲🇽 墨西哥 vs 南非</span>
    </div>

    <!-- 足球场 -->
    <div class="relative mx-3 mt-3 rounded-lg overflow-hidden" style="height:180px; background: linear-gradient(to bottom, #15803d, #166534);">
        <div class="pitch-line left-1/2 top-0 bottom-0 -translate-x-1/2"></div>
        <div class="pitch-line left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full"></div>
        <div class="pitch-line left-[8%] top-1/4 bottom-1/4 w-16 rounded-sm"></div>
        <div class="pitch-line right-[8%] top-1/4 bottom-1/4 w-16 rounded-sm"></div>
        <div class="pitch-line left-[12%] top-1/3 bottom-1/3 w-4 rounded-sm"></div>
        <div class="pitch-line right-[12%] top-1/3 bottom-1/3 w-4 rounded-sm"></div>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
            <div class="flex items-center gap-8 mb-1">
                <div class="text-center"><div class="text-xs opacity-80 pitch-area-home">韩国</div></div>
                <div class="text-center">
                    <div class="text-xl font-bold text-[#fbbf24]" id="countdown">--:--:--</div>
                    <div class="text-[10px] opacity-60" id="matchStatus">距离开赛</div>
                </div>
                <div class="text-center"><div class="text-xs opacity-80 pitch-area-away">捷克</div></div>
            </div>
            <div class="bg-black/50 rounded-lg px-4 py-1.5 flex gap-4 text-[10px] text-white/80" id="pitchStats">
                <span>进攻<br><strong class="text-white text-xs">0</strong></span>
                <span>危险进攻<br><strong class="text-white text-xs">20</strong></span>
                <span>控球率<br><strong class="text-white text-xs">10</strong></span>
                <span>角球<br><strong class="text-white text-xs">27</strong></span>
            </div>
        </div>
        <div class="absolute top-2 left-3 text-white/80 text-[10px] pitch-area-home-label">🇰🇷 韩国</div>
        <div class="absolute top-2 right-3 text-white/80 text-[10px] pitch-area-away-label">捷克 🇨🇿</div>
    </div>

    <!-- 图标菜单 -->
    <div class="flex justify-around items-center py-2 mx-3 text-xs text-[#999] border-b border-[#eee]">
        <span class="text-[#2563eb] font-bold">🏟️ 赛事</span>
        <span>📊 数据</span>
        <span>🎙️ 解说</span>
        <span>👕 阵容</span>
        <span>⚔️ VS</span>
        <span>📋 表格</span>
    </div>

    <!-- 赔率模块：由 JS 动态渲染 -->
    <div class="px-3 space-y-2 mt-2" id="oddsContainer"></div>

    <!-- Bottom Sheet -->
    <div id="betSheet" class="fixed inset-0 z-[100]" style="display:none">
        <div class="sheet-overlay absolute inset-0 bg-black/50 opacity-0 pointer-events-none" onclick="closeSheet()"></div>
        <div class="sheet-panel absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-xl translate-y-full max-h-[85vh] overflow-y-auto" style="transform: translateY(100%);">
            <div class="flex justify-center pt-2 pb-1"><div class="w-8 h-1 bg-gray-300 rounded-full"></div></div>
            <div class="flex items-center justify-between px-4 pb-2 border-b border-[#eee]">
                <span class="font-bold text-sm" id="sheetTitle">足球 让球</span>
                <span class="text-gray-400 text-lg cursor-pointer" onclick="closeSheet()">✕</span>
            </div>
            <div class="px-4 py-2 border-b border-[#eee]">
                <div class="text-[10px] text-gray-400" id="sheetLeague">世界杯2026(美加墨)</div>
                <div class="text-sm font-medium" id="sheetMatch">韩国 vs 捷克</div>
            </div>
            <div class="px-4 py-3 border-b border-[#eee]">
                <div class="text-base">
                    <span class="font-bold" id="sheetOptionName">主 0</span>
                    <span class="text-gray-400"> @ </span>
                    <span class="font-bold text-[#e1251b]" id="sheetOddsDisplay">0.83</span>
                </div>
            </div>
            <div class="px-4 py-3 border-b border-[#eee]">
                <div class="flex items-center gap-2">
                    <input type="tel" inputmode="decimal" id="betAmount" placeholder="输入下注金额" class="flex-1 border border-gray-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-blue-500" value="" oninput="this.value=this.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');calcPayout()">
                    <span class="text-blue-500 text-xs whitespace-nowrap cursor-pointer" onclick="document.getElementById('betAmount').value='10000';calcPayout()">最大投注金额</span>
                </div>
                <div class="text-xs text-gray-500 mt-2">预计可赢：<span class="font-semibold text-[#e1251b]" id="payoutDisplay">0.00</span> RMB</div>
            </div>
            <div class="flex items-center gap-2 px-4 py-3 border-t border-[#eee]">
                <button class="w-9 h-9 flex items-center justify-center bg-gray-100 rounded-lg text-gray-500 text-sm">⚙️</button>
                <button class="flex-1 py-2.5 bg-gray-100 rounded-lg text-sm font-medium text-gray-700">加到下单</button>
                <button class="flex-1 py-2.5 bg-gray-800 rounded-lg text-sm font-medium text-white" id="betNowBtn">下注 0.00 RMB</button>
            </div>
        </div>
    </div>

    <script>
        // ===================== 数据定义 =====================
        const matchData = {
            home: '韩国',
            away: '捷克',
            league: '世界杯2026(美加墨)',
            time: '22:00',
            stats: [0, 20, 10, 27],
            modules: {
                '让球': {
                    cols: 2,
                    items: [
                        ['主 0', '0.83'], ['客 0', '0.88'],
                        ['主 -0/0.5', '1.53'], ['客 +0/0.5', '0.50'],
                        ['主 0/0.5', '0.82'], ['客 0/0.5', '1.05'],
                        ['主 -0.5', '1.72'], ['客 +0.5', '0.48'],
                        ['主 +0.5', '0.45'], ['客 -0.5', '1.81'],
                        ['主 -0.5/1', '2.52'], ['客 +0.5/1', '0.35']
                    ]
                },
                '大小': {
                    cols: 2,
                    items: [
                        ['大 2/2.5', '1.02'], ['小 2/2.5', '0.86'],
                        ['大 2', '0.67'], ['小 2', '1.26'],
                        ['大 2.5', '1.28'], ['小 2.5', '0.66'],
                        ['大 1.5/2', '0.50'], ['小 1.5/2', '1.61'],
                        ['大 2.5/3', '1.58'], ['小 2.5/3', '0.51'],
                        ['大 3', '0.48'], ['小 3', '1.92']
                    ]
                },
                '独赢': {
                    cols: 3,
                    items: [
                        ['主胜', '2.72'], ['平局', '3.08'], ['客胜', '2.60']
                    ]
                },
                '波胆': {
                    cols: 3,
                    header: ['主胜', '平局', '客胜'],
                    items: [
                        ['1-0', '7.7'], ['0-0', '7.7'], ['0-1', '7.5'],
                        ['2-0', '14.5'], ['1-1', '6.3'], ['0-2', '15.5'],
                        ['2-1', '11.0'], ['2-2', '17.0'], ['1-2', '11.0'],
                        ['3-0', '26'], ['3-3', '81'], ['0-3', '23']
                    ]
                },
                '双方球队进球': {
                    cols: 2,
                    items: [
                        ['是', '1.85'], ['否', '1.95']
                    ]
                }
            }
        };

        // ===================== 渲染赔率 =====================
        let currentMatchName = matchData.home + ' vs ' + matchData.away;
        let currentSheetData = {};

        function renderOdds(data) {
            const container = document.getElementById('oddsContainer');
            let html = '';
            Object.keys(data.modules).forEach(name => {
                const mod = data.modules[name];
                html += '<div class="bg-white rounded shadow-sm overflow-hidden">';
                html += '<div class="bg-[#f9f9f9] px-3 py-2 font-bold text-sm border-b border-[#eee]">' + name + '</div>';

                // 波胆表头
                if (mod.header) {
                    html += '<div class="grid grid-cols-3 text-center bg-[#f5f5f5] py-1.5 text-[10px] text-[#999] border-b border-[#eee]">';
                    mod.header.forEach(h => { html += '<div>' + h + '</div>'; });
                    html += '</div>';
                }

                const colClass = 'grid-cols-' + (mod.cols || 2);
                html += '<div class="grid ' + colClass + ' gap-px bg-[#eee]">';

                mod.items.forEach(item => {
                    const option = item[0];
                    const odds = item[1];
                    const isRow = mod.cols === 2;
                    if (isRow) {
                        html += '<button class="odds-btn bg-white p-3 flex justify-between items-center text-left" data-module="' + name + '" data-option="' + option + '" data-odds="' + odds + '">';
                        html += '<span class="text-[#666] text-xs">' + option + '</span>';
                        html += '<span class="text-[#e1251b] font-bold text-sm">' + odds + '</span>';
                    } else {
                        html += '<button class="odds-btn bg-white py-2.5 flex flex-col items-center" data-module="' + name + '" data-option="' + option + '" data-odds="' + odds + '">';
                        html += '<span class="text-[#666] text-xs">' + option + '</span>';
                        html += '<span class="text-[#e1251b] font-bold text-sm mt-0.5">' + odds + '</span>';
                    }
                    html += '</button>';
                });

                html += '</div></div>';
            });
            container.innerHTML = html;

            // 绑定点击事件
            document.querySelectorAll('.odds-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const parent = this.closest('.grid');
                    if (parent) {
                        parent.querySelectorAll('.odds-btn').forEach(b => b.classList.remove('selected'));
                    }
                    this.classList.add('selected');

                    const module = this.dataset.module || '足球';
                    const option = this.dataset.option || '';
                    const odds = this.dataset.odds || '0';

                    currentSheetData = { module, option, odds, match: currentMatchName };

                    document.getElementById('sheetTitle').textContent = '足球 ' + module;
                    document.getElementById('sheetLeague').textContent = data.league;
                    document.getElementById('sheetMatch').textContent = currentMatchName;
                    document.getElementById('sheetOptionName').textContent = option;
                    document.getElementById('sheetOddsDisplay').textContent = odds;

                    document.getElementById('betAmount').value = '';
                    document.getElementById('payoutDisplay').textContent = '0.00';
                    document.getElementById('betNowBtn').textContent = '下注 0.00 RMB';

                    openSheet();
                });
            });
        }

        // 应用数据
        function applyMatch(data) {
            currentMatchName = data.home + ' vs ' + data.away;
            document.querySelector('.pitch-area-home').textContent = data.home;
            document.querySelector('.pitch-area-away').textContent = data.away;
            document.querySelector('.pitch-area-home-label').textContent = '🇰🇷 ' + data.home;
            document.querySelector('.pitch-area-away-label').textContent = data.away + ' 🇨🇿';
            document.querySelector('.top-nav-title').textContent = data.league + ' · ' + currentMatchName;

            // 更新球场数据
            const statEls = document.querySelectorAll('#pitchStats strong');
            if (data.stats) {
                data.stats.forEach((v, i) => { if (statEls[i]) statEls[i].textContent = v; });
            }

            renderOdds(data);
        }

        // ===================== Bottom Sheet =====================
        function openSheet() {
            const sheet = document.getElementById('betSheet');
            sheet.style.display = 'block';
            requestAnimationFrame(() => {
                document.querySelector('.sheet-overlay').classList.remove('opacity-0', 'pointer-events-none');
                document.querySelector('.sheet-panel').style.transform = 'translateY(0)';
            });
        }
        function closeSheet() {
            const sheet = document.getElementById('betSheet');
            document.querySelector('.sheet-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.querySelector('.sheet-panel').style.transform = 'translateY(100%)';
            setTimeout(() => { sheet.style.display = 'none'; }, 300);
        }
        function calcPayout() {
            const amount = parseFloat(document.getElementById('betAmount').value) || 0;
            const odds = parseFloat(currentSheetData.odds) || 0;
            const payout = amount * odds;
            document.getElementById('payoutDisplay').textContent = payout.toFixed(2);
            document.getElementById('betNowBtn').textContent = '下注 ' + amount.toFixed(2) + ' RMB';
        }
        document.getElementById('betAmount').addEventListener('input', calcPayout);

        // ===================== 比赛切换 =====================
        const matchTimes = {
            '韩国 vs 捷克': { h: 22, m: 0 },
            '墨西哥 vs 南非': { h: 3, m: 0 }
        };
        let countdownInterval;

        function startCountdown(matchKey) {
            if (countdownInterval) clearInterval(countdownInterval);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const mt = matchTimes[matchKey] || { h: 22, m: 0 };
            let target = new Date(today);
            target.setHours(mt.h, mt.m, 0, 0);
            if (mt.d) target.setDate(target.getDate() + mt.d);

            function tick() {
                const diff = target - new Date();
                if (diff <= 0) {
                    document.getElementById('countdown').textContent = '00:00:00';
                    document.getElementById('matchStatus').textContent = '比赛中';
                    return;
                }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown').textContent =
                    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                document.getElementById('matchStatus').textContent = '距离开赛';
            }
            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        const allMatchData = {
            '韩国 vs 捷克': matchData,
            '墨西哥 vs 南非': {
                home: '墨西哥', away: '南非', league: '世界杯2026(美加墨)', time: '22:00', stats: [0, 15, 45, 1],
                modules: {
                    '让球': { cols: 2, items: [['主 0', '0.83'], ['客 0', '0.88'], ['主 -0/0.5', '1.06'], ['客 +0/0.5', '0.83'], ['主 -0.5', '0.75'], ['客 +0.5', '1.18']] },
                    '大小': { cols: 2, items: [['大 2/2.5', '0.95'], ['小 2/2.5', '0.93'], ['大 2.5', '1.23'], ['小 2.5', '0.69']] },
                    '独赢': { cols: 3, items: [['主胜', '1.41'], ['平局', '4.40'], ['客胜', '6.70']] },
                    '波胆': { cols: 3, header: ['主胜', '平局', '客胜'], items: [['1-0', '5.2'], ['0-0', '8.0'], ['0-1', '9.0'], ['2-0', '9.0'], ['1-1', '6.0'], ['0-2', '15.0'], ['3-0', '18.0'], ['2-2', '12.0'], ['1-2', '11.0']] },
                    '双方球队进球': { cols: 2, items: [['是', '2.58'], ['否', '1.52']] }
                }
            }
        };

        function switchMatch(el) {
            document.querySelectorAll('#matchTabs span').forEach(s => {
                s.classList.remove('text-[#333]', 'font-bold', 'border-b-2', 'border-[#333]');
            });
            el.classList.add('text-[#333]', 'font-bold', 'border-b-2', 'border-[#333]');
            const matchKey = el.dataset.match;
            const data = allMatchData[matchKey];
            if (data) applyMatch(data);
        }

        // 初始化
        applyMatch(matchData);
        startCountdown('韩国 vs 捷克');
    </script>

</body>
</html>
