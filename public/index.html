<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实时赔率</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow-x: hidden; }
        .screenshot {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: block;
        }
        .refresh-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            font-family: -apple-system, sans-serif;
            backdrop-filter: blur(10px);
        }
        .refresh-bar span {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <img src="odds-screenshot.jpg" class="screenshot" alt="实时赔率">
    <div class="refresh-bar">
        <span>📸 截图模式 · 更新图片请发给我</span>
    </div>
</body>
</html>
