<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ 竞彩足球下单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f1a; --card: #1a1a2e; --card2: #16213e;
    --accent: #00d4aa; --red: #ff4757; --green: #2ed573; --gold: #ffa502;
    --text: #e8e8f0; --muted: #8888a0; --border: #2a2a4a;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Microsoft YaHei UI', sans-serif;
    padding: 12px; min-height: 100vh;
  }
  .container { max-width: 800px; margin: 0 auto; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
  }
  .header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .header h1 span { color: var(--accent); }

  .stats {
    display: flex; gap: 8px; font-size: 12px; flex-wrap: wrap;
  }
  .stats div {
    background: var(--card); padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); text-align: center;
  }
  .stats .num { font-size: 16px; font-weight: bold; display: block; }
  .stats .label { font-size: 10px; color: var(--muted); }
  .profit { color: var(--green); } .loss { color: var(--red); }

  .form-card {
    background: var(--card); border-radius: 12px; padding: 14px;
    border: 1px solid var(--border); margin-bottom: 14px;
  }
  .form-card h2 { font-size: 14px; margin-bottom: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }

  .form-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;
  }
  .form-row-3 {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px;
  }
  .form-group { display: flex; flex-direction: column; gap: 3px; }
  .form-group label { font-size: 11px; color: var(--muted); }
  .form-group input, .form-group select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 8px; color: var(--text); font-size: 13px; outline: none; width: 100%;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

  .btn {
    background: var(--accent); color: #0f0f1a; border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-danger { background: var(--red); color: white; }
  .btn-outline {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    font-size: 12px; padding: 6px 12px;
  }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 4px; }
  .form-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .calc-hint { font-size: 11px; color: var(--muted); }
  .calc-val { color: var(--gold); font-weight: bold; }

  .filter-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px;
  }
  .filter-bar input, .filter-bar select {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; color: var(--text); font-size: 12px; outline: none;
  }

  .table-wrap {
    background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    background: var(--card2); padding: 8px 6px; text-align: left; color: var(--muted);
    font-weight: 500; white-space: nowrap; position: sticky; top: 0; font-size: 11px;
  }
  td { padding: 8px 6px; border-top: 1px solid var(--border); white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; }
  .tag-win { background: rgba(46,213,115,0.2); color: var(--green); }
  .tag-lose { background: rgba(255,71,87,0.2); color: var(--red); }
  .tag-pending { background: rgba(255,165,2,0.2); color: var(--gold); }
  .tag-cancel { background: rgba(136,136,160,0.2); color: var(--muted); }
  .empty-row td { text-align: center; color: var(--muted); padding: 30px; }
  .del-btn { cursor: pointer; opacity: 0.4; }
  .del-btn:hover { opacity: 1; color: var(--red); }
  .author-tag { font-size: 10px; color: var(--muted); }

  .name-chip {
    display: inline-block; background: var(--card2); border-radius: 10px;
    padding: 4px 10px; font-size: 11px; margin: 2px; border: 1px solid var(--border);
    cursor: pointer;
  }
  .name-chip.active { border-color: var(--accent); color: var(--accent); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--accent); border-radius: 8px;
    padding: 10px 20px; font-size: 13px; z-index: 100;
    display: none; animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; } }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 12px; padding: 20px; max-width: 360px; width: 90%; border: 1px solid var(--border);
  }
  .modal h3 { font-size: 16px; margin-bottom: 10px; }
  .modal p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal .btn-group { display: flex; gap: 8px; justify-content: flex-end; }

  .match-card {
    background: var(--card2); border-radius: 8px; padding: 8px 12px;
    margin-bottom: 8px; border: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: border-color 0.2s;
  }
  .match-card:hover { border-color: var(--accent); }
  .match-card .teams { font-size: 13px; font-weight: 500; }
  .match-card .league { font-size: 10px; color: var(--muted); }
  .match-card .time { font-size: 10px; color: var(--gold); }
  .match-card.selected { border-color: var(--accent); background: rgba(0,212,170,0.1); }

  .play-category {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px;
  }
  .play-cat-btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 4px 12px; font-size: 11px; cursor: pointer; color: var(--muted);
    transition: all 0.2s;
  }
  .play-cat-btn.active { background: var(--accent); color: #0f0f1a; border-color: var(--accent); font-weight: 600; }

  .play-options {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;
  }
  .play-opt-btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--text);
    transition: all 0.15s;
  }
  .play-opt-btn:hover { border-color: var(--accent); }
  .play-opt-btn.selected { border-color: var(--gold); color: var(--gold); background: rgba(255,165,2,0.1); }

  .quick-bet {
    display: flex; gap: 8px; align-items: center; margin-top: 8px;
    padding: 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border);
  }
  .quick-bet label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .quick-bet input {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; color: var(--text); font-size: 13px; width: 80px; outline: none;
  }
  .quick-bet input:focus { border-color: var(--accent); }

  .name-panel {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center;
  }
  .name-panel .current-label { font-size: 11px; color: var(--muted); }

  @media (max-width: 500px) {
    .form-row-3 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>⚽ <span>滚球</span>下单</h1>
  <div class="stats" id="statsBar">
    <div><span class="num" id="sTotal">-</span><span class="label">单数</span></div>
    <div><span class="num" id="sWinRate">-</span><span class="label">胜率</span></div>
    <div><span class="num" id="sProfit">-</span><span class="label">盈亏</span></div>
  </div>
</div>

<div class="form-card">
  <h2>📝 新订单</h2>

  <!-- 名字选择 -->
  <div class="name-panel">
    <span class="current-label">谁下的：</span>
    <span class="name-chip" onclick="setName('圣凯')">圣凯</span>
    <span class="name-chip" onclick="setName('')">➕ 自定义</span>
    <input type="text" id="authorName" placeholder="名字" maxlength="10"
      style="width:80px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;outline:none;display:none"
      oninput="document.getElementById('currentName').textContent=this.value">
  </div>

  <!-- 比赛快速选择 -->
  <div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="font-size:11px;color:var(--muted)">比赛选择</span>
      <span style="font-size:10px;color:var(--gold)" id="matchLabel">即将开赛</span>
    </div>
    <div id="matchSelector">
      <!-- 预置热门比赛 -->
      <div class="match-card selected" data-match="中国 vs 日本" data-league="2026世界杯亚洲外围赛" onclick="selectMatch(this)">
        <div>
          <div class="teams">🇨🇳 中国 vs 日本 🇯🇵</div>
          <div class="league">2026世界杯亚洲外围赛</div>
        </div>
        <div class="time">08:00</div>
      </div>
    </div>
  </div>

  <!-- 玩法大类 -->
  <div style="margin-bottom:6px">
    <span style="font-size:11px;color:var(--muted)">玩法大类</span>
  </div>
  <div class="play-category" id="playCategory">
    <span class="play-cat-btn active" data-cat="rangqiu" onclick="switchCategory('rangqiu')">让球</span>
    <span class="play-cat-btn" data-cat="daxiao" onclick="switchCategory('daxiao')">大小球</span>
    <span class="play-cat-btn" data-cat="duying" onclick="switchCategory('duying')">独赢</span>
    <span class="play-cat-btn" data-cat="banshang" onclick="switchCategory('banshang')">上半场</span>
    <span class="play-cat-btn" data-cat="bodan" onclick="switchCategory('bodan')">波胆</span>
    <span class="play-cat-btn" data-cat="jinqiu" onclick="switchCategory('jinqiu')">总进球</span>
    <span class="play-cat-btn" data-cat="other" onclick="switchCategory('other')">其他</span>
  </div>

  <!-- 具体选项 -->
  <div style="margin-bottom:6px">
    <span style="font-size:11px;color:var(--muted)">具体选项</span>
  </div>
  <div class="play-options" id="playOptions"></div>

  <input type="hidden" id="orderDate">
  <!-- 赔率和金额快速填 -->
  <div class="quick-bet">
    <label>赔率</label>
    <input type="number" id="odds" step="0.01" min="1" placeholder="2.00" value="1.00">
    <label>金额 ¥</label>
    <input type="number" id="betAmount" step="10" min="1" placeholder="100" value="">
    <span style="flex:1"></span>
    <button class="btn" onclick="addOrder()" style="white-space:nowrap">➕ 下单</button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:4px" id="calcHint">输入金额自动算奖金</div>
</div>

<div class="filter-bar">
  <input type="date" id="filterDate" onchange="loadOrders()">
  <select id="filterResult" onchange="loadOrders()">
    <option value="全部">全部</option>
    <option value="待结算">⏳ 待结算</option>
    <option value="中">✅ 已中</option>
    <option value="未中">❌ 未中</option>
  </select>
  <button class="btn btn-sm btn-outline" onclick="document.getElementById('filterDate').value='';document.getElementById('filterResult').value='全部';loadOrders()">清除</button>
  <span style="margin-left:auto;font-size:11px;color:var(--muted)" id="filterCount"></span>
  <button class="btn btn-sm btn-outline" onclick="showClearModal()">🗑 清空</button>
</div>

<div class="table-wrap">
  <table>
    <thead><tr>
      <th>时间</th><th>谁</th><th>比赛</th><th>玩法</th><th>赔率</th><th>金额</th><th>盈亏</th><th>结果</th><th></th>
    </tr></thead>
    <tbody id="orderBody"></tbody>
  </table>
</div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <h3>⚠️ 确认清空</h3>
    <p>删除所有人填的所有订单，不可恢复！</p>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="closeClear()">取消</button>
      <button class="btn btn-danger" onclick="clearAll()">确认清空</button>
    </div>
  </div>
</div>

<script>
const API = '/api';

// ======================= 数据定义 =======================
const PLAY_OPTIONS = {
  rangqiu: ['中国+2/2.5', '中国+2', '中国+2.5', '日本-2/2.5', '日本-2', '日本-2.5'],
  daxiao: ['大2.5/3', '大2.5', '大3/3.5', '小3', '小3/3.5', '小2.5/3', '小2.5'],
  duying: ['中国 胜', '和局', '日本 胜'],
  banshang: [
    '中国+1(上)', '日本-1(上)', '中国+0.5/1(上)', '日本-0.5/1(上)',
    '大1/1.5(上)', '小1/1.5(上)', '大1.5(上)', '小1.5(上)',
    '中国胜(上)', '和局(上)', '日本胜(上)'
  ],
  bodan: [
    '1-0', '2-0', '2-1', '3-0', '3-1', '3-2',
    '0-0', '1-1', '2-2',
    '0-1', '0-2', '1-2', '0-3', '1-3', '2-3',
    '其他比分'
  ],
  jinqiu: ['0-1球', '2-3球', '4-6球', '7+球', '0-1球(上)', '2-3球(上)', '3+球(上)'],
  other: [
    '双方进球-是', '双方进球-否',
    '单', '双',
    '中国大0.5', '中国小0.5',
    '日本大2.5', '日本小2.5',
    '15分盘口-让球', '15分盘口-大小', '15分盘口-独赢',
    '球队进球-中国大0.5', '球队进球-中国小0.5',
    '球队进球-日本大2.5', '球队进球-日本小2.5'
  ]
};

const CATEGORY_NAMES = {
  rangqiu: '让球', daxiao: '大小球', duying: '独赢',
  banshang: '上半场', bodan: '波胆', jinqiu: '总进球', other: '其他'
};

// ======================= 状态 =======================
let currentCategory = 'rangqiu';
let selectedOption = '';
let currentMatch = '中国 vs 日本';

// ======================= 初始化 =======================
document.getElementById('orderDate').value = new Date().toISOString().slice(0,10);
document.getElementById('betAmount').addEventListener('input', calcHint);
document.getElementById('odds').addEventListener('input', calcHint);
renderOptions('rangqiu');

// ======================= 名字系统 =======================
function setName(name) {
  const input = document.getElementById('authorName');
  const currentLabel = document.querySelector('.current-label');
  if (name === '') {
    input.style.display = 'inline-block';
    input.focus();
  } else {
    input.style.display = 'none';
    input.value = name;
  }
  document.querySelectorAll('.name-chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
}

function getAuthor() {
  const val = document.getElementById('authorName').value.trim();
  return val || '匿名';
}

// ======================= 比赛选择 =======================
function selectMatch(el) {
  document.querySelectorAll('.match-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  currentMatch = el.dataset.match;
}

// ======================= 玩法切换 =======================
function switchCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.play-cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  selectedOption = '';
  renderOptions(cat);
}

function renderOptions(cat) {
  const container = document.getElementById('playOptions');
  const opts = PLAY_OPTIONS[cat] || [];
  container.innerHTML = opts.map(o =>
    `<span class="play-opt-btn" data-opt="${o}" onclick="selectOpt(this, '${o}')">${o}</span>`
  ).join('');
}

function selectOpt(el, opt) {
  document.querySelectorAll('.play-opt-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedOption = opt;
}

// ======================= 奖金计算 =======================
function calcHint() {
  const odds = parseFloat(document.getElementById('odds').value) || 1;
  const amount = parseFloat(document.getElementById('betAmount').value) || 0;
  if (amount > 0) {
    const payout = (odds * amount).toFixed(2);
    const profit = (payout - amount).toFixed(2);
    document.getElementById('calcHint').textContent =
      `奖金 ¥${payout} | 净盈利 ¥${profit}`;
  } else {
    document.getElementById('calcHint').textContent = '输入金额自动算奖金';
  }
}

// ======================= 下单 =======================
async function addOrder() {
  const date = document.getElementById('orderDate').value;
  const author = getAuthor();
  const odds = parseFloat(document.getElementById('odds').value);
  const amount = parseFloat(document.getElementById('betAmount').value);

  if (!selectedOption) return showToast('请先选择一个具体选项（点击上面的选项按钮）');
  if (!odds || odds < 1) return showToast('赔率至少 1.0');
  if (!amount || amount < 1) return showToast('请填写金额');

  const catName = CATEGORY_NAMES[currentCategory] || '其他';
  const playLabel = catName + ' - ' + selectedOption;

  try {
    const res = await fetch(API + '/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        date,
        home: currentMatch.split(' vs ')[0] || currentMatch,
        away: currentMatch.split(' vs ')[1] || '',
        play: playLabel,
        option: selectedOption,
        odds,
        amount,
        author,
        result: '待结算'
      })
    });
    if (!res.ok) throw new Error('提交失败');
    document.getElementById('odds').value = '1.00';
    document.getElementById('betAmount').value = '';
    selectedOption = '';
    document.querySelectorAll('.play-opt-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('calcHint').textContent = '输入金额自动算奖金';
    showToast('✅ ' + author + ' 下了 ' + playLabel + ' ¥' + amount);
    loadOrders(); loadStats();
  } catch(e) { showToast('❌ 添加失败: ' + e.message); }
}

// ======================= 订单管理 =======================
async function updateResult(id, result) {
  try {
    await fetch(API + '/orders/' + id, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ result })
    });
    loadOrders(); loadStats();
  } catch(e) { showToast('更新失败'); }
}

async function deleteOrder(id) {
  if (!confirm('删除这条订单？')) return;
  try {
    await fetch(API + '/orders/' + id, { method: 'DELETE' });
    loadOrders(); loadStats();
  } catch(e) { showToast('删除失败'); }
}

async function loadOrders() {
  const date = document.getElementById('filterDate').value;
  const result = document.getElementById('filterResult').value;
  let url = API + '/orders';
  const params = [];
  if (date) params.push('date=' + date);
  if (result && result !== '全部') params.push('result=' + encodeURIComponent(result));
  if (params.length) url += '?' + params.join('&');

  try {
    const res = await fetch(url);
    const orders = await res.json();
    const tbody = document.getElementById('orderBody');
    if (orders.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="9">暂无订单 ⚽</td></tr>';
      document.getElementById('filterCount').textContent = '';
      return;
    }
    let html = '';
    orders.forEach(o => {
      const payout = o.odds * o.amount;
      let profitHtml = '-';
      if (o.result === '中') {
        const p = payout - o.amount;
        profitHtml = '<span class="profit">+¥' + p.toFixed(2) + '</span>';
      } else if (o.result === '未中') {
        profitHtml = '<span class="loss">-¥' + o.amount.toFixed(2) + '</span>';
      } else if (o.result === '取消') {
        profitHtml = '<span style="color:var(--muted)">¥0</span>';
      }

      let resultHtml = '';
      if (o.result === '待结算') {
        resultHtml = '<select style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:2px 4px;color:var(--text);font-size:11px" onchange="updateResult(' + o.id + ',this.value)">'
          + '<option value="待结算" selected>⏳ 待结算</option>'
          + '<option value="中">✅ 中</option>'
          + '<option value="未中">❌ 未中</option>'
          + '<option value="取消">取消</option></select>';
      } else {
        const cls = { '中':'tag-win','未中':'tag-lose','取消':'tag-cancel' }[o.result] || 'tag-pending';
        resultHtml = '<span class="tag ' + cls + '">' + (o.result === '中' ? '✅ ' : o.result === '未中' ? '❌ ' : '') + o.result + '</span>';
      }

      const authorHtml = o.author ? '<span style="font-size:11px;font-weight:500">' + o.author + '</span>' : '';
      const matchHtml = o.home + (o.away ? ' vs ' + o.away : '');

      html += '<tr>'
        + '<td style="font-size:10px;color:var(--muted)">' + o.date + '</td>'
        + '<td>' + authorHtml + '</td>'
        + '<td style="font-size:11px">' + matchHtml + '</td>'
        + '<td style="font-size:11px">' + o.play + '</td>'
        + '<td>' + o.odds + '</td>'
        + '<td>¥' + o.amount.toFixed(2) + '</td>'
        + '<td>' + profitHtml + '</td>'
        + '<td>' + resultHtml + '</td>'
        + '<td style="text-align:right"><span class="del-btn" onclick="deleteOrder(' + o.id + ')">✕</span></td>'
        + '</tr>';
    });
    tbody.innerHTML = html;
    document.getElementById('filterCount').textContent = orders.length + ' 条';
  } catch(e) { console.error(e); }
}

async function loadStats() {
  try {
    const res = await fetch(API + '/stats');
    const s = await res.json();
    document.getElementById('sTotal').textContent = s.total;
    document.getElementById('sWinRate').textContent = s.winRate + '%';
    const profitEl = document.getElementById('sProfit');
    if (s.profit >= 0) profitEl.innerHTML = '<span class="profit">+¥' + s.profit + '</span>';
    else profitEl.innerHTML = '<span class="loss">-¥' + Math.abs(s.profit) + '</span>';
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function showClearModal() { document.getElementById('clearModal').classList.add('show'); }
function closeClear() { document.getElementById('clearModal').classList.remove('show'); }
async function clearAll() {
  try { await fetch(API + '/orders', { method: 'DELETE' }); loadOrders(); loadStats(); } catch(e) {}
  closeClear();
}

loadOrders(); loadStats();

// 每10秒自动刷新
setInterval(() => { loadOrders(); loadStats(); }, 10000);
</script>
</body>
</html>
